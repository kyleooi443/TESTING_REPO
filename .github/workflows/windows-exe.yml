name: Build Windows app

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-exe.yml
      - assets/**
      - cat_reminder.py
      - Minute-Cat.pyz
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packager
        run: python -m pip install pyinstaller==6.16.0
      - name: Run tests
        run: python -m unittest -v
      - name: Build single-file executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Minute-Cat --add-data "assets;assets" cat_reminder.py
      - name: Publish executable in repository
        shell: bash
        run: |
          test -s dist/Minute-Cat.exe
          cp dist/Minute-Cat.exe Minute-Cat.exe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Minute-Cat.exe
          if ! git diff --cached --quiet; then
            git commit -m "build: update Windows executable"
            git push origin HEAD:main
          fi
