name: Build Windows app

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-exe.yml
      - assets/**
      - cat_reminder.py
      - Minute-Cat.pyz
      - test_cat_reminder.py
      - windows/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: microsoft/setup-msbuild@v2
      - name: Run tests
        run: python -m unittest -v
      - name: Build native Windows executable
        run: msbuild windows/MinuteCat.csproj /p:Configuration=Release /verbosity:minimal
      - name: Check that the Windows app opens
        shell: powershell
        run: |
          $app = Start-Process -FilePath windows/bin/Release/Minute-Cat.exe -PassThru
          try {
            Start-Sleep -Seconds 5
            $app.Refresh()
            if ($app.HasExited) { throw "Minute Cat exited during startup" }
            if ($app.MainWindowTitle -ne "Minute Cat") { throw "Minute Cat control window did not open" }
          }
          finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - name: Publish executable in repository
        shell: bash
        run: |
          test -s windows/bin/Release/Minute-Cat.exe
          cp windows/bin/Release/Minute-Cat.exe Minute-Cat.exe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Minute-Cat.exe
          if ! git diff --cached --quiet; then
            git commit -m "build: update Windows executable"
            git push origin HEAD:main
          fi
